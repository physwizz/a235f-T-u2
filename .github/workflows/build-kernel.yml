name: Build Galaxy A23 kernel

"on":
  workflow_dispatch:
    inputs:
      build_modules:
        description: Also build kernel modules
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: a235f-t-u2-manual-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential cpio flex git libelf-dev libssl-dev libtinfo5 lz4 python3 rsync unzip zip

      - name: Validate bundled Clang toolchain
        shell: bash
        run: |
          set -Eeuo pipefail
          TOOLCHAIN="$GITHUB_WORKSPACE/toolchain/llvm-arm-toolchain-ship/10.0/bin"
          BINUTILS="$GITHUB_WORKSPACE/toolchain/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/bin"
          CLANG="$TOOLCHAIN/clang"
          DTC="$GITHUB_WORKSPACE/tools/dtc"
          test -x "$CLANG" || { echo '::error::Bundled Clang is missing or not executable'; exit 1; }
          test -x "$TOOLCHAIN/clang-10" || { echo '::error::Bundled clang-10 binary is missing or not executable'; exit 1; }
          test -x "$BINUTILS/aarch64-linux-android-ld.bfd" || { echo '::error::Bundled AArch64 linker is missing or not executable'; exit 1; }
          test -x "$BINUTILS/aarch64-linux-android-as" || { echo '::error::Bundled AArch64 assembler is missing or not executable'; exit 1; }
          test -x "$DTC" || { echo '::error::tools/dtc is missing or not executable'; exit 1; }
          "$CLANG" --version | head -n 1
          "$CLANG" --target=aarch64-linux-gnu -x c -fsyntax-only - <<< 'int main(void) { return 0; }'
          "$BINUTILS/aarch64-linux-android-ld.bfd" --version | head -n 1
          "$BINUTILS/aarch64-linux-android-as" --version | head -n 1
          git rev-parse HEAD | tee source-commit.txt
          git status --short

      - name: Configure and build kernel
        shell: bash
        env:
          LC_ALL: C
        run: |
          set -Eeuo pipefail
          cd "$GITHUB_WORKSPACE"
          mkdir -p out artifacts
          {
            echo "Build started: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "Commit: $(git rev-parse HEAD)"
            uname -a
            nproc
            free -h
          } | tee artifacts/build-info.txt
          export ARCH=arm64
          TOOLCHAIN="$GITHUB_WORKSPACE/toolchain/llvm-arm-toolchain-ship/10.0/bin"
          BINUTILS="$GITHUB_WORKSPACE/toolchain/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/bin"
          CLANG="$TOOLCHAIN/clang"
          DTC="$GITHUB_WORKSPACE/tools/dtc"
          CROSS_PREFIX="$BINUTILS/aarch64-linux-android-"
          make -j2 -C "$GITHUB_WORKSPACE" O="$GITHUB_WORKSPACE/out" \
            ARCH=arm64 CC="$CLANG" CROSS_COMPILE="$CROSS_PREFIX" \
            CLANG_TRIPLE=aarch64-linux-gnu- DTC_EXT="$DTC" \
            CONFIG_BUILD_ARM64_DT_OVERLAY=y CONFIG_SECTION_MISMATCH_WARN_ONLY=y \
            vendor/physwizz_defconfig
          make -j2 -C "$GITHUB_WORKSPACE" O="$GITHUB_WORKSPACE/out" \
            ARCH=arm64 CC="$CLANG" CROSS_COMPILE="$CROSS_PREFIX" \
            CLANG_TRIPLE=aarch64-linux-gnu- DTC_EXT="$DTC" \
            CONFIG_BUILD_ARM64_DT_OVERLAY=y CONFIG_SECTION_MISMATCH_WARN_ONLY=y Image
          make -j2 -C "$GITHUB_WORKSPACE" O="$GITHUB_WORKSPACE/out" \
            ARCH=arm64 CC="$CLANG" CROSS_COMPILE="$CROSS_PREFIX" \
            CLANG_TRIPLE=aarch64-linux-gnu- DTC_EXT="$DTC" \
            CONFIG_BUILD_ARM64_DT_OVERLAY=y CONFIG_SECTION_MISMATCH_WARN_ONLY=y dtbs
          if [[ "${{ inputs.build_modules }}" == "true" ]]; then
            make -j2 -C "$GITHUB_WORKSPACE" O="$GITHUB_WORKSPACE/out" \
              ARCH=arm64 CC="$CLANG" CROSS_COMPILE="$CROSS_PREFIX" \
              CLANG_TRIPLE=aarch64-linux-gnu- DTC_EXT="$DTC" \
              CONFIG_BUILD_ARM64_DT_OVERLAY=y CONFIG_SECTION_MISMATCH_WARN_ONLY=y modules
          fi

      - name: Stage outputs and audit configuration
        if: always()
        shell: bash
        run: |
          set -u
          mkdir -p artifacts/device-tree
          cp source-commit.txt artifacts/source-commit.txt 2>/dev/null || true
          if [[ -s out/arch/arm64/boot/Image ]]; then
            cp out/arch/arm64/boot/Image artifacts/Image
            sha256sum artifacts/Image | tee artifacts/SHA256SUMS
            file artifacts/Image | tee artifacts/image-file-type.txt
          else
            echo 'No kernel Image was produced.' | tee artifacts/BUILD-RESULT.txt
          fi
          [[ ! -f out/.config ]] || cp out/.config artifacts/kernel.config
          if [[ -d out/arch/arm64/boot ]]; then
            find out/arch/arm64/boot -type f \( -name '*.dtb' -o -name '*.dtbo' \) -print | sort > artifacts/device-tree-files.txt
            while IFS= read -r dtfile; do
              [[ -n "$dtfile" ]] || continue
              mkdir -p "artifacts/device-tree/$(dirname "${dtfile#out/arch/arm64/boot/}")"
              cp "$dtfile" "artifacts/device-tree/${dtfile#out/arch/arm64/boot/}"
            done < artifacts/device-tree-files.txt
            if [[ -s artifacts/device-tree-files.txt ]]; then
              find artifacts/device-tree -type f -print0 | sort -z | xargs -0 -r sha256sum > artifacts/DEVICE-TREE-SHA256SUMS
            else
              echo 'No DTB/DTBO files were produced by the build.' > artifacts/DEVICE-TREE-RESULT.txt
            fi
          else
            echo 'Kernel boot output directory was not created.' > artifacts/DEVICE-TREE-RESULT.txt
          fi
          if [[ -f out/.config ]]; then
            {
              echo 'Configuration flags requiring review (informational; not an automatic vulnerability verdict):'
              grep -E '^(CONFIG_MODULE_SIG=|CONFIG_MODULE_SIG_FORCE=|CONFIG_MODULE_FORCE_LOAD=|CONFIG_MODULE_FORCE_UNLOAD=|CONFIG_DEBUG_FS=|CONFIG_SECURITY=|CONFIG_SECURITY_SELINUX=|CONFIG_RANDOMIZE_BASE=|CONFIG_STRICT_KERNEL_RWX=|CONFIG_STRICT_MODULE_RWX=|CONFIG_KALLSYMS_ALL=)' out/.config || true
            } > artifacts/config-audit.txt
          fi
          find out -type f -name '*.ko' -print 2>/dev/null | head -n 500 > artifacts/module-files.txt || true
          {
            echo 'Artifact inventory:'
            find artifacts -type f -printf '%P %s bytes\n' | sort
          } > artifacts/artifact-inventory.txt

      - name: Validate and summarize device-tree binaries
        if: always()
        shell: bash
        run: |
          set -u
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, subprocess
          root = Path("artifacts/device-tree")
          report = ["Device-tree binary audit", "=========================", ""]
          files = sorted(p for p in root.rglob("*") if p.is_file() and p.suffix in (".dtb", ".dtbo")) if root.exists() else []
          if not files:
              report += ["FAIL: no DTB/DTBO files found in staged artifacts."]
          else:
              report += [f"Found {len(files)} DTB/DTBO files.", ""]
              invalid = False
              for p in files:
                  data = p.read_bytes()
                  magic = data[:4].hex()
                  declared = int.from_bytes(data[4:8], "big") if len(data) >= 8 else -1
                  valid = magic == "d00dfeed" and declared == len(data)
                  invalid = invalid or not valid
                  report += [
                      f"File: {p}",
                      f"  bytes: {len(data)}",
                      f"  SHA-256: {hashlib.sha256(data).hexdigest()}",
                      f"  FDT magic: {magic} ({'OK' if magic == 'd00dfeed' else 'BAD'})",
                      f"  header total size: {declared} ({'matches file' if declared == len(data) else 'MISMATCH'})",
                  ]
                  dtc = Path("tools/dtc")
                  if dtc.is_file() and dtc.exists():
                      try:
                          r = subprocess.run([str(dtc.resolve()), "-I", "dtb", "-O", "dts", str(p.resolve())], capture_output=True, text=True, timeout=30)
                          if r.returncode == 0:
                              props = [line.strip() for line in r.stdout.splitlines() if "compatible =" in line or "model =" in line or "board-id" in line or "subtype-id" in line]
                              report += ["  decompile: OK"] + [f"  {x}" for x in props[:12]]
                          else:
                              report += [f"  decompile: FAILED ({r.stderr.strip()[:300]})"]
                      except Exception as e:
                          report += [f"  decompile: FAILED ({e})"]
                  report += [""]
              overlays = [p for p in files if p.suffix == ".dtbo"]
              report += [
                  f"DTBO payload bytes if concatenated without an Android DTBO header/table: {sum(p.stat().st_size for p in overlays)}",
                  "IMPORTANT: this is a payload-size calculation only. It is NOT a flashable dtbo.img.",
                  "Do not package or flash these overlays until entry metadata (id/rev/custom fields), board firmware match, and image format are verified.",
                  ""
              ]
              report += ["RESULT: FAIL - at least one DTB/DTBO has an invalid FDT header or size." if invalid else "RESULT: FDT headers and declared sizes pass basic structural checks; device/firmware compatibility is NOT proven."]
          Path("artifacts/device-tree-audit.txt").write_text("\n".join(report) + "\n")
          print("\n".join(report))
          PY

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: galaxy-a23-kernel-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
