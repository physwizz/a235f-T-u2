name: Build Galaxy A23 kernel

"on":
  workflow_dispatch:
    inputs:
      build_modules:
        description: Also build kernel modules
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: a235f-t-u2-manual-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache cpio flex git libelf-dev libssl-dev libtinfo5 lz4 python3 rsync unzip zip

      - name: Restore compiler cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ccache
          key: ${{ runner.os }}-kernel-ccache-clang10-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-kernel-ccache-clang10-

      - name: Validate bundled Clang toolchain
        shell: bash
        run: |
          set -Eeuo pipefail
          TOOLCHAIN="$GITHUB_WORKSPACE/toolchain/llvm-arm-toolchain-ship/10.0/bin"
          BINUTILS="$GITHUB_WORKSPACE/toolchain/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/bin"
          CLANG="$TOOLCHAIN/clang"
          DTC="$GITHUB_WORKSPACE/tools/dtc"
          test -x "$CLANG" || { echo '::error::Bundled Clang is missing or not executable'; exit 1; }
          test -x "$TOOLCHAIN/clang-10" || { echo '::error::Bundled clang-10 binary is missing or not executable'; exit 1; }
          test -x "$BINUTILS/aarch64-linux-android-ld.bfd" || { echo '::error::Bundled AArch64 linker is missing or not executable'; exit 1; }
          test -x "$BINUTILS/aarch64-linux-android-as" || { echo '::error::Bundled AArch64 assembler is missing or not executable'; exit 1; }
          test -x "$DTC" || { echo '::error::tools/dtc is missing or not executable'; exit 1; }
          "$CLANG" --version | head -n 1
          "$CLANG" --target=aarch64-linux-gnu -x c -fsyntax-only - <<< 'int main(void) { return 0; }'
          "$BINUTILS/aarch64-linux-android-ld.bfd" --version | head -n 1
          "$BINUTILS/aarch64-linux-android-as" --version | head -n 1
          git rev-parse HEAD | tee source-commit.txt
          git status --short

      - name: Configure and build kernel
        shell: bash
        env:
          LC_ALL: C
        run: |
          set -Eeuo pipefail
          cd "$GITHUB_WORKSPACE"
          mkdir -p out artifacts
          {
            echo "Build started: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "Commit: $(git rev-parse HEAD)"
            uname -a
            nproc
            free -h
          } | tee artifacts/build-info.txt
          export ARCH=arm64
          export CCACHE_DIR="$HOME/.cache/ccache"
          export CCACHE_COMPILERCHECK=content
          mkdir -p "$CCACHE_DIR"
          ccache --max-size=2G
          ccache --zero-stats
          TOOLCHAIN="$GITHUB_WORKSPACE/toolchain/llvm-arm-toolchain-ship/10.0/bin"
          BINUTILS="$GITHUB_WORKSPACE/toolchain/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/bin"
          CLANG="$TOOLCHAIN/clang"
          DTC="$GITHUB_WORKSPACE/tools/dtc"
          CROSS_PREFIX="$BINUTILS/aarch64-linux-android-"
          make -j"$(nproc)" -C "$GITHUB_WORKSPACE" O="$GITHUB_WORKSPACE/out" \
            ARCH=arm64 CC="ccache $CLANG" CROSS_COMPILE="$CROSS_PREFIX" \
            CLANG_TRIPLE=aarch64-linux-gnu- DTC_EXT="$DTC" \
            CONFIG_BUILD_ARM64_DT_OVERLAY=y CONFIG_SECTION_MISMATCH_WARN_ONLY=y \
            vendor/physwizz_defconfig
          make -j"$(nproc)" -C "$GITHUB_WORKSPACE" O="$GITHUB_WORKSPACE/out" \
            ARCH=arm64 CC="ccache $CLANG" CROSS_COMPILE="$CROSS_PREFIX" \
            CLANG_TRIPLE=aarch64-linux-gnu- DTC_EXT="$DTC" \
            CONFIG_BUILD_ARM64_DT_OVERLAY=y CONFIG_SECTION_MISMATCH_WARN_ONLY=y Image
          make -j"$(nproc)" -C "$GITHUB_WORKSPACE" O="$GITHUB_WORKSPACE/out" \
            ARCH=arm64 CC="ccache $CLANG" CROSS_COMPILE="$CROSS_PREFIX" \
            CLANG_TRIPLE=aarch64-linux-gnu- DTC_EXT="$DTC" \
            CONFIG_BUILD_ARM64_DT_OVERLAY=y CONFIG_SECTION_MISMATCH_WARN_ONLY=y dtbs
          if [[ "${{ inputs.build_modules }}" == "true" ]]; then
            make -j"$(nproc)" -C "$GITHUB_WORKSPACE" O="$GITHUB_WORKSPACE/out" \
              ARCH=arm64 CC="ccache $CLANG" CROSS_COMPILE="$CROSS_PREFIX" \
              CLANG_TRIPLE=aarch64-linux-gnu- DTC_EXT="$DTC" \
              CONFIG_BUILD_ARM64_DT_OVERLAY=y CONFIG_SECTION_MISMATCH_WARN_ONLY=y modules
          fi

      - name: Stage outputs and audit configuration
        if: always()
        shell: bash
        run: |
          set -u
          mkdir -p artifacts/device-tree
          ccache --show-stats > artifacts/ccache-stats.txt 2>&1 || true
          cp source-commit.txt artifacts/source-commit.txt 2>/dev/null || true
          if [[ -s out/arch/arm64/boot/Image ]]; then
            cp out/arch/arm64/boot/Image artifacts/Image
            (cd artifacts && sha256sum Image) | tee artifacts/SHA256SUMS
            file artifacts/Image | tee artifacts/image-file-type.txt
          else
            echo 'No kernel Image was produced.' | tee artifacts/BUILD-RESULT.txt
          fi
          [[ ! -f out/.config ]] || cp out/.config artifacts/kernel.config
          if [[ -d out/arch/arm64/boot ]]; then
            find out/arch/arm64/boot -type f \( -name '*.dtb' -o -name '*.dtbo' \) -print | sort > artifacts/device-tree-files.txt
            while IFS= read -r dtfile; do
              [[ -n "$dtfile" ]] || continue
              mkdir -p "artifacts/device-tree/$(dirname "${dtfile#out/arch/arm64/boot/}")"
              cp "$dtfile" "artifacts/device-tree/${dtfile#out/arch/arm64/boot/}"
            done < artifacts/device-tree-files.txt
            if [[ -s artifacts/device-tree-files.txt ]]; then
              (cd artifacts && find device-tree -type f -print0 | sort -z | xargs -0 -r sha256sum) > artifacts/DEVICE-TREE-SHA256SUMS
            else
              echo 'No DTB/DTBO files were produced by the build.' > artifacts/DEVICE-TREE-RESULT.txt
            fi
          else
            echo 'Kernel boot output directory was not created.' > artifacts/DEVICE-TREE-RESULT.txt
          fi
          if [[ -f out/.config ]]; then
            {
              echo 'Configuration flags requiring review (informational; not an automatic vulnerability verdict):'
              grep -E '^(CONFIG_MODULE_SIG=|CONFIG_MODULE_SIG_FORCE=|CONFIG_MODULE_FORCE_LOAD=|CONFIG_MODULE_FORCE_UNLOAD=|CONFIG_DEBUG_FS=|CONFIG_SECURITY=|CONFIG_SECURITY_SELINUX=|CONFIG_RANDOMIZE_BASE=|CONFIG_STRICT_KERNEL_RWX=|CONFIG_STRICT_MODULE_RWX=|CONFIG_KALLSYMS_ALL=)' out/.config || true
            } > artifacts/config-audit.txt
          fi
          mkdir -p artifacts/modules
          while IFS= read -r -d '' module; do
            rel="${module#out/}"
            mkdir -p "artifacts/modules/$(dirname "$rel")"
            cp "$module" "artifacts/modules/$rel"
          done < <(find out -type f -name '*.ko' -print0 2>/dev/null | head -z -n 500 || true)
          if find artifacts/modules -type f -name '*.ko' -print -quit | grep -q .; then
            find artifacts/modules -type f -name '*.ko' -printf '%P\n' | sort > artifacts/module-files.txt
          else
            echo 'No kernel modules were staged. Re-run with build_modules=true if modules are required.' > artifacts/module-files.txt
          fi
          cat > artifacts/PACKAGING-STATUS.txt <<'EOF'
          STATUS: NOT FLASHABLE
          This artifact contains a raw kernel Image and separate DTB/DTBO files.
          It does not contain a verified boot.img, recovery installer, or flashable dtbo.img.
          Do not flash until the exact device model, firmware/build number, boot-image header and partition format are verified.
          EOF
          {
            echo 'Artifact inventory:'
            find artifacts -type f ! -name 'artifact-inventory.txt' -printf '%P %s bytes\n' | sort
          } > artifacts/artifact-inventory.txt

      - name: Validate and summarize device-tree binaries
        if: always()
        shell: bash
        run: |
          set -u
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, subprocess
          root = Path("artifacts/device-tree")
          report = ["Device-tree binary audit", "=========================", ""]
          files = sorted(p for p in root.rglob("*") if p.is_file() and p.suffix in (".dtb", ".dtbo")) if root.exists() else []
          if not files:
              report += ["FAIL: no DTB/DTBO files found in staged artifacts."]
          else:
              report += [f"Found {len(files)} DTB/DTBO files.", ""]
              invalid = False
              for p in files:
                  data = p.read_bytes()
                  magic = data[:4].hex()
                  declared = int.from_bytes(data[4:8], "big") if len(data) >= 8 else -1
                  valid = magic == "d00dfeed" and declared == len(data)
                  invalid = invalid or not valid
                  report += [
                      f"File: {p}",
                      f"  bytes: {len(data)}",
                      f"  SHA-256: {hashlib.sha256(data).hexdigest()}",
                      f"  FDT magic: {magic} ({'OK' if magic == 'd00dfeed' else 'BAD'})",
                      f"  header total size: {declared} ({'matches file' if declared == len(data) else 'MISMATCH'})",
                  ]
                  dtc = Path("tools/dtc")
                  if dtc.is_file() and dtc.exists():
                      try:
                          r = subprocess.run([str(dtc.resolve()), "-I", "dtb", "-O", "dts", str(p.resolve())], capture_output=True, text=True, timeout=30)
                          if r.returncode == 0:
                              props = [line.strip() for line in r.stdout.splitlines() if "compatible =" in line or "model =" in line or "board-id" in line or "subtype-id" in line]
                              report += ["  decompile: OK"] + [f"  {x}" for x in props[:12]]
                          else:
                              report += [f"  decompile: FAILED ({r.stderr.strip()[:300]})"]
                      except Exception as e:
                          report += [f"  decompile: FAILED ({e})"]
                  report += [""]
              overlays = [p for p in files if p.suffix == ".dtbo"]
              report += [
                  f"DTBO payload bytes if concatenated without an Android DTBO header/table: {sum(p.stat().st_size for p in overlays)}",
                  "IMPORTANT: this is a payload-size calculation only. It is NOT a flashable dtbo.img.",
                  "Do not package or flash these overlays until entry metadata (id/rev/custom fields), board firmware match, and image format are verified.",
                  ""
              ]
              report += ["RESULT: FAIL - at least one DTB/DTBO has an invalid FDT header or size." if invalid else "RESULT: FDT headers and declared sizes pass basic structural checks; device/firmware compatibility is NOT proven."]
          Path("artifacts/device-tree-audit.txt").write_text("\n".join(report) + "\n")
          print("\n".join(report))
          PY

      - name: Verify artifact integrity and kernel-module compatibility
        if: always()
        shell: bash
        run: |
          set -u
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, re, sys

          root = Path("artifacts")
          report = ["Artifact integrity and compatibility audit", "==========================================", ""]
          failures = []

          image = root / "Image"
          if not image.is_file():
              failures.append("FAIL: raw kernel Image is missing.")
          else:
              image_bytes = image.read_bytes()
              release_match = re.search(rb"Linux version ([^\x00\s]+)", image_bytes)
              release = release_match.group(1).decode("ascii", "replace") if release_match else None
              report.append(f"Image size: {len(image_bytes)} bytes")
              report.append(f"Image SHA-256: {hashlib.sha256(image_bytes).hexdigest()}")
              report.append(f"Kernel release: {release or 'NOT FOUND'}")
              sums = root / "SHA256SUMS"
              if not sums.is_file():
                  failures.append("FAIL: SHA256SUMS is missing.")
              else:
                  fields = sums.read_text().split()
                  expected = fields[0] if fields else ""
                  actual = hashlib.sha256(image_bytes).hexdigest()
                  if expected != actual:
                      failures.append("FAIL: Image SHA-256 does not match SHA256SUMS.")
                  else:
                      report.append("Image checksum: PASS")

              modules = sorted((root / "modules").rglob("*.ko")) if (root / "modules").exists() else []
              if not modules:
                  report.append("Module vermagic check: SKIPPED (no .ko files staged)")
              else:
                  for module in modules:
                      data = module.read_bytes()
                      match = re.search(rb"vermagic=([^\x00]+)", data)
                      vermagic = match.group(1).decode("ascii", "replace") if match else None
                      module_release = vermagic.split()[0] if vermagic else None
                      report.append(f"Module: {module.relative_to(root)}")
                      report.append(f"  vermagic: {vermagic or 'NOT FOUND'}")
                      if not release or module_release != release:
                          failures.append(f"FAIL: {module.relative_to(root)} vermagic does not match Image kernel release.")
                      else:
                          report.append("  release match: PASS")

          dt_root = root / "device-tree"
          dt_files = sorted([*dt_root.rglob("*.dtb"), *dt_root.rglob("*.dtbo")]) if dt_root.exists() else []
          for path in dt_files:
              data = path.read_bytes()
              declared = int.from_bytes(data[4:8], "big") if len(data) >= 8 else -1
              if data[:4] != bytes.fromhex("d00dfeed") or declared != len(data):
                  failures.append(f"FAIL: invalid FDT header/size: {path.relative_to(root)}")
          report.append(f"Device-tree structural checks: {len(dt_files)} file(s) checked")

          manifest = root / "DEVICE-TREE-SHA256SUMS"
          if manifest.is_file():
              for line in manifest.read_text().splitlines():
                  if not line.strip():
                      continue
                  fields = line.split(None, 1)
                  if len(fields) != 2:
                      failures.append("FAIL: malformed DEVICE-TREE-SHA256SUMS entry.")
                      continue
                  expected, relpath = fields[0], fields[1].strip().lstrip("*")
                  target = root / relpath
                  if not target.is_file() or hashlib.sha256(target.read_bytes()).hexdigest() != expected:
                      failures.append(f"FAIL: device-tree checksum mismatch/missing file: {relpath}")
              if not failures:
                  report.append("Device-tree checksums: PASS")
          elif dt_files:
              failures.append("FAIL: DEVICE-TREE-SHA256SUMS is missing.")

          report += ["", "RESULT: " + ("FAIL" if failures else "PASS")]
          report += failures
          (root / "release-audit.txt").write_text("\n".join(report) + "\n")
          print("\n".join(report))
          sys.exit(1 if failures else 0)
          PY

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: galaxy-a23-kernel-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
